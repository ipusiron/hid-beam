# HIDBeam AP 設定テンプレート。配置先は /etc/hostapd/hostapd.conf。
# wpa_passphrase は必ず8〜63文字の独自値へ変更すること。初期値のままだと
# hidbeam-preflight.sh がブリッジの起動を失敗させる。
interface=wlan0
driver=nl80211
ssid=AGB-HID-Bridge
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE_ME_STRONG_PASSPHRASE
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=JP
